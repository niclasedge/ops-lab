<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="880" height="560" fill="#14171c"/>

  <text x="32" y="44" fill="#e6e9ef" font-size="17" font-weight="bold">just abgleich diff-reviewer</text>
  <text x="32" y="66" fill="#8a929e" font-size="12">Die Zusage aus dem Vorschlag, gehalten gegen den Diff — zwei Läufe desselben Changes.</text>

  <!-- Lauf 1: ein Befund -->
  <rect x="32" y="88" width="816" height="216" rx="6" fill="#1b1f26" stroke="#2c323c"/>
  <text x="48" y="112" fill="#8a929e" font-size="11">1 — vor dem Einliefern des Belegs</text>

  <text x="48" y="142" fill="#e6e9ef" font-size="13">Abgleich — diff-reviewer</text>
  <text x="48" y="168" fill="#8a929e" font-size="13">  Basis main · 12 zugesagt · 14 im Diff</text>

  <text x="48" y="200" font-size="13"><tspan fill="#d05c5c">  Zusatz</tspan><tspan fill="#e6e9ef">      angefasst, aber nicht zugesagt (0)</tspan></text>
  <text x="48" y="220" fill="#8a929e" font-size="13">              keine</text>

  <text x="48" y="250" font-size="13"><tspan fill="#d05c5c">  Auslassung</tspan><tspan fill="#e6e9ef">  zugesagt, aber nicht angefasst (2)</tspan></text>
  <text x="48" y="270" fill="#e6e9ef" font-size="13">              docs/abgleich.svg</text>
  <text x="48" y="290" fill="#e6e9ef" font-size="13">              abgleich</text>

  <!-- Lauf 2: deckungsgleich -->
  <rect x="32" y="324" width="816" height="112" rx="6" fill="#1b1f26" stroke="#2c323c"/>
  <text x="48" y="348" fill="#8a929e" font-size="11">2 — nachdem der Vorschlag richtiggestellt war, unmittelbar vor dem Einliefern dieses Belegs</text>

  <text x="48" y="378" fill="#e6e9ef" font-size="13">Abgleich — diff-reviewer</text>
  <text x="48" y="404" fill="#8a929e" font-size="13">  Basis main · 11 zugesagt · 15 im Diff</text>
  <text x="48" y="428" font-size="13"><tspan fill="#5fb87a">  deckungsgleich</tspan><tspan fill="#e6e9ef">  der Diff haelt sich an die Zusage</tspan></text>

  <!-- Lesehilfe -->
  <text x="32" y="474" fill="#8a929e" font-size="12">Beide Läufe endeten mit Exit 0. Der Abgleich ist kein Gate: eine Zusage kann sich im Lauf eines Changes</text>
  <text x="32" y="494" fill="#8a929e" font-size="12">berechtigt ändern, und ein Gate, das daran scheitert, erzeugt Druck, sie nachträglich passend zu schreiben.</text>
  <text x="32" y="522" fill="#8a929e" font-size="12">Die zweite Auslassung in Lauf 1 — „abgleich“ — ist der Name eines just-Ziels, kein Pfad. Von einem</text>
  <text x="32" y="542" fill="#8a929e" font-size="12">Dateinamen wie „justfile“ ist er textlich nicht zu unterscheiden; der Skill nennt diese Grenze.</text>
</svg>
