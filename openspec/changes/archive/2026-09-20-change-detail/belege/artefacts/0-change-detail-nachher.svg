<text x="24" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="bold" fill="#2f6f4f" text-anchor="start" xml:space="preserve">Change-Karte change-detail — vier Klappen</text>
<text x="24" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="normal" fill="#666" text-anchor="start" xml:space="preserve">7/8 Aufgaben · laeuft · Gates: gate1, gate2 · Arbeitsbaum change-detail</text>
<text x="24" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#2f6f4f" text-anchor="start" xml:space="preserve">▾ Worum es geht</text>
<rect x="24" y="96" width="952" height="192" fill="#ffffff" stroke="#d8d8d4"/>
<text x="40" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="bold" fill="#8a8a8a" text-anchor="start" xml:space="preserve">WARUM</text>
<text x="40" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" xml:space="preserve">Die Web-Ansicht zeigt zu einem Change heute eine einzige Klappe: seine Aufgabenliste.</text>
<text x="40" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" xml:space="preserve">Alles andere, was der Change über sich selbst weiß, bleibt in Dateien liegen, die nur</text>
<text x="40" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" xml:space="preserve">sieht, wer sie im Editor öffnet. Wer die Karte aufschlägt, erfährt den Stand — nicht das</text>
<text x="40" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" xml:space="preserve">Vorhaben.</text>
<text x="40" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="bold" fill="#8a8a8a" text-anchor="start" xml:space="preserve">WAS AUSDRÜCKLICH NICHT</text>
<text x="40" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" xml:space="preserve">Der Wortlaut von `gate1.md`, `gate2.md` und `fertig.md` kommt nicht auf die Karte — die</text>
<text x="40" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" xml:space="preserve">Gate-Marken stehen dort bereits, und der Nachweistext wiederholte nur, was die Marke schon</text>
<text x="40" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" xml:space="preserve">sagt. `design.md` bleibt ebenfalls draußen: es liegt in vier von siebzehn Changes und ist</text>
<text x="40" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" xml:space="preserve">damit keine Größe, auf die sich eine Ansicht stützen kann.</text>
<text x="24" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#8a4b00" text-anchor="start" xml:space="preserve">▸ 5 Anforderungen — zugeklappt als Vorgabe, hier aufgeschlagen</text>
