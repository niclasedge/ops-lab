<svg xmlns="http://www.w3.org/2000/svg" width="980" height="331" viewBox="0 0 980 331">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .t { font-size: 20px; font-weight: 600; fill: #111; font-family: ui-sans-serif, system-ui, sans-serif; }
